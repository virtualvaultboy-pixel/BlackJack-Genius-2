name: Build Android APK (Debug)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'service-worker.js'
      - 'privacy.html'
      - 'manifest.json'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/
          [ -f service-worker.js ] && cp service-worker.js www/ || echo "no service-worker.js"
          [ -f privacy.html ] && cp privacy.html www/ || echo "no privacy.html"
          [ -f manifest.json ] && cp manifest.json www/ || echo "no manifest.json"
          shopt -s nullglob
          for f in icon*.png favicon*.png favicon*.ico *.svg apple-touch-icon*.png; do
            cp "$f" www/ 2>/dev/null && echo "copied $f"
          done
          echo "=== Contents of www/ ==="
          ls -la www/

      - name: Install Capacitor
        run: npm install --no-fund --no-audit

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            echo "Adding Android platform"
            npx cap add android
          else
            echo "Syncing existing Android platform"
            npx cap sync android
          fi

      - name: Patch AndroidManifest.xml (permissions + portrait + PiP)
        run: |
          python3 << 'PYEOF'
          import os, re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          # 1) Permissions camera + micro
          new_perms = (
              '    <uses-permission android:name="android.permission.CAMERA" />\n'
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
              '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n'
              '    <uses-feature android:name="android.hardware.camera" android:required="false" />\n'
              '    <uses-feature android:name="android.hardware.microphone" android:required="false" />\n'
          )
          if "android.permission.CAMERA" not in content:
              content = content.replace("</manifest>", new_perms + "</manifest>")
              print("Permissions injected")
          else:
              print("Permissions already present")
          # 2) v1.14 - Force orientation portrait + configChanges (requis pour PiP).
          # On ajoute screenOrientation + configChanges qui inclut screenSize/screenLayout
          # /smallestScreenSize/orientation (necessaires Android pour ne pas restart
          # l'activity en PiP).
          if 'android:screenOrientation' not in content:
              content = re.sub(
                  r'(<activity\b)',
                  r'\1 android:screenOrientation="portrait" android:configChanges="screenSize|smallestScreenSize|screenLayout|orientation|keyboardHidden" android:supportsPictureInPicture="true"',
                  content,
                  count=1
              )
              print("Portrait + PiP + configChanges injected")
          elif 'android:supportsPictureInPicture' not in content:
              # screenOrientation deja la mais pas le PiP : ajouter PiP + configChanges
              content = re.sub(
                  r'(<activity\b[^>]*?)>',
                  r'\1 android:configChanges="screenSize|smallestScreenSize|screenLayout|orientation|keyboardHidden" android:supportsPictureInPicture="true">',
                  content,
                  count=1
              )
              print("PiP + configChanges injected (orientation already present)")
          else:
              print("All activity attrs already present")
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          print("=== Final AndroidManifest.xml ===")
          print(content)
          PYEOF

      - name: Patch MainActivity.java (auto-enter PiP on Home)
        run: |
          python3 << 'PYEOF'
          import os, glob, re
          # v1.17 - Patch de MainActivity.java pour declencher PiP automatiquement
          # quand l'user appuie Home (onUserLeaveHint). Faisable sur Android 8+.
          # Capacitor genere un MainActivity minimal heritant de BridgeActivity.
          # On le remplace par une version qui override onUserLeaveHint.
          matches = glob.glob("android/app/src/main/java/**/MainActivity.java", recursive=True)
          if not matches:
              print("WARN: MainActivity.java not found, skipping PiP patch")
          else:
              path = matches[0]
              print(f"Patching {path}")
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              # Extract package name from first line
              m = re.match(r'package\s+([^;]+);', content)
              if not m:
                  print("WARN: package declaration not found, skipping")
              elif 'enterPictureInPictureMode' in content:
                  print("PiP already patched, skipping")
              else:
                  package = m.group(1)
                  new_content = f"""package {package};

          import android.app.PictureInPictureParams;
          import android.content.res.Configuration;
          import android.os.Build;
          import android.util.Rational;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {{
              @Override
              public void onUserLeaveHint() {{
                  super.onUserLeaveHint();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {{
                      try {{
                          PictureInPictureParams params = new PictureInPictureParams.Builder()
                              .setAspectRatio(new Rational(9, 16))
                              .build();
                          enterPictureInPictureMode(params);
                      }} catch (Exception e) {{
                          // PiP not supported on this device or in this state, ignore
                      }}
                  }}
              }}

              @Override
              public void onPictureInPictureModeChanged(boolean isInPip, Configuration newConfig) {{
                  super.onPictureInPictureModeChanged(isInPip, newConfig);
                  // Notify the WebView so CSS/JS can adapt
                  if (this.bridge != null && this.bridge.getWebView() != null) {{
                      String js = "document.body.classList." + (isInPip ? "add" : "remove") + "('pip-mode');";
                      this.bridge.getWebView().post(() ->
                          this.bridge.getWebView().evaluateJavascript(js, null)
                      );
                  }}
              }}
          }}
          """
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(new_content)
                  print("MainActivity.java patched with PiP support")
                  print("=== New MainActivity.java ===")
                  print(new_content)
          PYEOF

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: bjgenius-debug-apk-${{ github.run_number }}-${{ github.run_attempt }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
          overwrite: true
